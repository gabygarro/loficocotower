name: deploy-cloudflare-pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest pages deploy ./dist/client --project-name="${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}"

      - name: Attach custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          output=$(npx wrangler@latest pages project domains add "${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}" loficocotower.gabygarro.dev 2>&1)
          exit_code=$?
          echo "$output"

          if [ "$exit_code" -eq 0 ]; then
            exit 0
          fi

          if echo "$output" | grep -Eiq "already exists|already in use|has already been taken"; then
            echo "Domain already attached to this or another Pages project. Continuing."
            exit 0
          fi

          echo "Domain attach failed with a real error; failing workflow."
          exit "$exit_code"
